name: Deploy PR preview to GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}previews/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout main for stable root
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout PR head for preview
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-src

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build main root
        working-directory: main-src
        run: |
          npm ci
          npm run build:github

      - name: Build PR preview
        working-directory: preview-src
        env:
          GITHUB_PAGES_BASE: /xiaoman-ledger/previews/pr-${{ github.event.pull_request.number }}/
        run: |
          npm ci
          npm run build:github

      - name: Compose Pages artifact
        run: |
          mkdir -p pages-dist/previews/pr-${{ github.event.pull_request.number }}
          cp -R main-src/github-dist/. pages-dist/
          cp -R preview-src/github-dist/. pages-dist/previews/pr-${{ github.event.pull_request.number }}/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist

      - name: Deploy Pages root + PR preview
        id: deployment
        uses: actions/deploy-pages@v4
