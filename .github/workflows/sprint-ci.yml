name: Sprint validation
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Test and capture diagnostics
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee test.log
      - name: Report test failure
        if: steps.tests.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### Automated test diagnostics\n\n```text\n' > test-comment.md
          tail -n 180 test.log >> test-comment.md
          printf '\n```\n' >> test-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file test-comment.md
      - name: Stop after test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1
      - run: npm run build:github
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run eval -- --fixture-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/screenshots/
