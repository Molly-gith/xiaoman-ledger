name: Sprint validation
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck and capture diagnostics
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log
      - name: Report typecheck failure
        if: steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '### Automated typecheck diagnostics\n\n```text\n' > diagnostics-comment.md
          cat typecheck.log >> diagnostics-comment.md
          printf '\n```\n' >> diagnostics-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics-comment.md
      - name: Stop after typecheck failure
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
      - run: npm run lint
      - run: npm test
      - run: npm run build:github
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build AI consent test fixture
        run: npm run build:github
        env:
          VITE_AI_API_URL: https://xiaoman-ai-test.example/api/ai/question
      - name: Verify AI consent and fallback in browser
        run: npm run test:browser -- tests/browser/ai-question.spec.ts
        env:
          AI_BROWSER_TEST: "1"
      - run: npm run eval -- --fixture-provider
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/screenshots/
