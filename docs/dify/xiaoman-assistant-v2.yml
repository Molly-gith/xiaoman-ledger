      - id: xiaoman-check
        data:
          type: code
          title: 输出检查
          desc: 检查字段、日期、白名单和单一意图；不合格立即停止，金额仍由本机计算。
          selected: false
          code_language: python3
          code: |
            import json
            import re
            import math
            import calendar
            from datetime import date, timedelta
            from decimal import Decimal

            LEGACY_SCHEMA = json.loads("{\"type\":\"object\",\"additionalProperties\":false,\"properties\":{\"intent\":{\"type\":\"string\",\"enum\":[\"transactions\",\"question\",\"clarification\"]},\"transactions\":{\"type\":\"array\",\"maxItems\":5,\"items\":{\"type\":\"object\",\"additionalProperties\":false,\"properties\":{\"type\":{\"type\":\"string\",\"enum\":[\"income\",\"expense\"]},\"amount\":{\"type\":\"number\",\"exclusiveMinimum\":0,\"maximum\":999999999999.99},\"category\":{\"type\":\"string\",\"enum\":[\"餐饮\",\"购物\",\"交通\",\"居住\",\"健康\",\"医疗\",\"学习\",\"娱乐\",\"收入\",\"其他\"]},\"occurred_at\":{\"type\":\"string\",\"pattern\":\"^\\\\d{4}-\\\\d{2}-\\\\d{2}$\"},\"note\":{\"type\":\"string\",\"maxLength\":100},\"nature_suggestion\":{\"type\":[\"string\",\"null\"],\"enum\":[\"消费\",\"浪费\",\"投资\",null]},\"confidence\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1},\"ambiguous\":{\"type\":\"boolean\"}},\"required\":[\"type\",\"amount\",\"category\",\"occurred_at\",\"note\",\"nature_suggestion\",\"confidence\",\"ambiguous\"]}},\"answer\":{\"type\":\"string\",\"maxLength\":1200},\"next_actions\":{\"type\":\"array\",\"maxItems\":3,\"items\":{\"type\":\"string\",\"maxLength\":300}},\"referenced_facts\":{\"type\":\"array\",\"items\":{\"type\":\"string\"}},\"clarification\":{\"type\":\"string\",\"maxLength\":300},\"confidence\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1}},\"required\":[\"intent\",\"transactions\",\"answer\",\"next_actions\",\"referenced_facts\",\"clarification\",\"confidence\"]}")
            V2_SCHEMA = json.loads("{\"type\":\"object\",\"additionalProperties\":false,\"properties\":{\"intent\":{\"type\":\"string\",\"enum\":[\"transactions\",\"query\",\"preference\",\"clarification\",\"question\"]},\"transactions\":{\"type\":\"array\",\"maxItems\":5,\"items\":{\"type\":\"object\",\"additionalProperties\":false,\"properties\":{\"type\":{\"type\":\"string\",\"enum\":[\"income\",\"expense\"]},\"amount\":{\"type\":\"number\",\"exclusiveMinimum\":0,\"maximum\":999999999999.99},\"category\":{\"type\":\"string\",\"enum\":[\"餐饮\",\"购物\",\"交通\",\"居住\",\"健康\",\"医疗\",\"学习\",\"娱乐\",\"其他\",\"收入\"]},\"occurred_at\":{\"type\":\"string\",\"pattern\":\"^\\\\d{4}-\\\\d{2}-\\\\d{2}$\"},\"note\":{\"type\":\"string\",\"maxLength\":100},\"nature_suggestion\":{\"type\":[\"string\",\"null\"],\"enum\":[\"消费\",\"浪费\",\"投资\",null]},\"confidence\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1},\"ambiguous\":{\"type\":\"boolean\"}},\"required\":[\"type\",\"amount\",\"category\",\"occurred_at\",\"note\",\"nature_suggestion\",\"confidence\",\"ambiguous\"]}},\"query\":{\"type\":[\"object\",\"null\"],\"additionalProperties\":false,\"properties\":{\"range\":{\"type\":\"object\",\"additionalProperties\":false,\"properties\":{\"startDate\":{\"type\":\"string\",\"pattern\":\"^\\\\d{4}-\\\\d{2}-\\\\d{2}$\"},\"endDate\":{\"type\":\"string\",\"pattern\":\"^\\\\d{4}-\\\\d{2}-\\\\d{2}$\"}},\"required\":[\"startDate\",\"endDate\"]},\"ledgerKind\":{\"type\":\"string\",\"enum\":[\"personal\",\"family\",\"travel\"]},\"type\":{\"type\":\"string\",\"enum\":[\"income\",\"expense\",\"all\"]},\"categories\":{\"type\":\"array\",\"minItems\":1,\"maxItems\":10,\"uniqueItems\":true,\"items\":{\"type\":\"string\",\"enum\":[\"餐饮\",\"购物\",\"交通\",\"居住\",\"健康\",\"医疗\",\"学习\",\"娱乐\",\"其他\",\"收入\"]}},\"natures\":{\"type\":\"array\",\"minItems\":1,\"maxItems\":4,\"uniqueItems\":true,\"items\":{\"type\":\"string\",\"enum\":[\"消费\",\"浪费\",\"投资\",\"未分类\"]}},\"comparison\":{\"type\":\"string\",\"enum\":[\"previous_month\",\"previous_period\"]},\"metric\":{\"type\":\"string\",\"enum\":[\"total\",\"count\",\"breakdown\"]},\"breakdownBy\":{\"type\":\"string\",\"enum\":[\"category\",\"nature\"]}},\"required\":[\"range\",\"type\",\"metric\"]},\"preference\":{\"type\":[\"object\",\"null\"],\"additionalProperties\":false,\"properties\":{\"keyword\":{\"type\":\"string\",\"minLength\":2,\"maxLength\":40},\"category\":{\"type\":[\"string\",\"null\"],\"enum\":[\"餐饮\",\"购物\",\"交通\",\"居住\",\"健康\",\"医疗\",\"学习\",\"娱乐\",\"其他\",null]},\"nature\":{\"type\":[\"string\",\"null\"],\"enum\":[\"消费\",\"浪费\",\"投资\",null]}},\"required\":[\"keyword\",\"category\",\"nature\"]},\"answer\":{\"type\":\"string\",\"maxLength\":1200},\"clarification\":{\"type\":\"string\",\"maxLength\":300},\"confidence\":{\"type\":\"number\",\"minimum\":0,\"maximum\":1}},\"required\":[\"intent\",\"transactions\",\"query\",\"preference\",\"answer\",\"clarification\",\"confidence\"]}")

            def reject():
                # 不输出原问题、历史内容或模型原文，错误只标记格式不合格。
                raise ValueError("输出格式或查询范围不符合小满约定")

            def check_schema(value, spec):
                types = spec.get("type")
                types = types if isinstance(types, list) else [types]
                matched = any(
                    (kind == "null" and value is None) or
                    (kind == "object" and isinstance(value, dict)) or
                    (kind == "array" and isinstance(value, list)) or
                    (kind == "string" and isinstance(value, str)) or
                    (kind == "boolean" and isinstance(value, bool)) or
                    (kind == "number" and isinstance(value, (int, float)) and not isinstance(value, bool) and math.isfinite(value))
                    for kind in types
                )
                if not matched: reject()
                if "enum" in spec and value not in spec["enum"]: reject()
                if value is None: return
                if isinstance(value, dict):
                    if any(key not in value for key in spec.get("required", [])): reject()
                    properties = spec.get("properties", {})
                    if spec.get("additionalProperties") is False and any(key not in properties for key in value): reject()
                    for key, item in value.items():
                        if key in properties: check_schema(item, properties[key])
                elif isinstance(value, list):
                    if len(value) < spec.get("minItems", 0) or len(value) > spec.get("maxItems", 10000): reject()
                    if spec.get("uniqueItems") and len({json.dumps(item, sort_keys=True) for item in value}) != len(value): reject()
                    if "items" in spec:
                        for item in value: check_schema(item, spec["items"])
                elif isinstance(value, str):
                    if len(value) < spec.get("minLength", 0) or len(value) > spec.get("maxLength", 1000000): reject()
                    if "pattern" in spec and re.search(spec["pattern"], value) is None: reject()
                elif isinstance(value, (int, float)) and not isinstance(value, bool):
                    if "minimum" in spec and value < spec["minimum"]: reject()
                    if "maximum" in spec and value > spec["maximum"]: reject()
                    if "exclusiveMinimum" in spec and value <= spec["exclusiveMinimum"]: reject()

            def day(value):
                if not isinstance(value, str) or re.fullmatch(r"\d{4}-\d{2}-\d{2}", value) is None: reject()
                try: parsed = date.fromisoformat(value)
                except (ValueError, TypeError): reject()
                if parsed < date(1900, 1, 1) or parsed > date(9998, 12, 31): reject()
                return parsed

            def check_drafts(drafts, today):
                for item in drafts:
                    if item["ambiguous"] is not False or day(item["occurred_at"]) > today: reject()
                    amount = Decimal(str(item["amount"])) * 100
                    if amount != amount.to_integral_value(): reject()
                    if item["type"] == "income":
                        if item["category"] != "收入" or item["nature_suggestion"] is not None: reject()
                    elif item["category"] == "收入": reject()

            def check_query(plan):
                start, end = day(plan["range"]["startDate"]), day(plan["range"]["endDate"])
                if start > end or (end - start).days + 1 > 3660: reject()
                if "breakdownBy" in plan and plan["metric"] != "breakdown": reject()
                if (plan.get("breakdownBy") == "nature" or "natures" in plan) and plan["type"] != "expense": reject()
                if plan["type"] == "income":
                    if "natures" in plan or any(item != "收入" for item in plan.get("categories", [])): reject()
                if plan["type"] == "expense" and "收入" in plan.get("categories", []): reject()
                comparison = plan.get("comparison")
                if comparison == "previous_month":
                    if start.day != 1 or start.year != end.year or start.month != end.month or end.day != calendar.monthrange(end.year, end.month)[1]: reject()
                    if start == date(1900, 1, 1): reject()
                elif comparison == "previous_period":
                    if start - timedelta(days=(end - start).days + 1) < date(1900, 1, 1): reject()

            def main(result: dict, operation: str, payload: str, context: str) -> dict:
                ctx = json.loads(context)
                today = day(ctx["today"])
                if operation == "assistLedgerV2":
                    check_schema(result, V2_SCHEMA)
                    intent = result["intent"]
                    active = {"transactions": "transactions", "query": "query", "preference": "preference", "question": "answer", "clarification": "clarification"}[intent]
                    empty = {"transactions": [], "query": None, "preference": None, "answer": "", "clarification": ""}
                    for field, expected in empty.items():
                        if field != active and result[field] != expected: reject()
                    if intent == "transactions":
                        if not result["transactions"]: reject()
                        check_drafts(result["transactions"], today)
                    elif intent == "query":
                        if result["query"] is None: reject()
                        check_query(result["query"])
                    elif intent == "preference":
                        preference = result["preference"]
                        if preference is None or not 2 <= len(preference["keyword"].strip()) <= 40: reject()
                        if preference["category"] is None and preference["nature"] is None: reject()
                    elif not result[active].strip(): reject()
                else:
                    # 旧版仍输出原七字段；不添加query或preference，不重算旧金额。
                    check_schema(result, LEGACY_SCHEMA)
                    intent = result["intent"]
                    if intent == "transactions":
                        if not result["transactions"] or result["answer"] or result["clarification"] or result["next_actions"] or result["referenced_facts"]: reject()
                        check_drafts(result["transactions"], today)
                    elif intent == "question":
                        if result["transactions"] or not result["answer"].strip() or result["clarification"]: reject()
                    elif intent == "clarification":
                        if result["transactions"] or result["answer"] or not result["clarification"].strip() or result["next_actions"] or result["referenced_facts"]: reject()
                return {"result_json": result}
